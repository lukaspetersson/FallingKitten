plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lukas.android.fallingkitten'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lukas.android.fallingkitten'
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName '1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing is intentionally not configured in source. Use the existing
            // Play App Signing/upload-key flow through owner-controlled local or CI secrets.
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
